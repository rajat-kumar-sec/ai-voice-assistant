<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA · AI Companion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bg"></canvas>

  <div class="hud hud-top">
    <div class="brand">◆ NOVA <span>AI</span></div>
    <div class="status">
      <span class="pip" id="statusDot"></span>
      <span id="statusText">Initializing...</span>
    </div>
  </div>

  <button class="model-btn" id="modeBtn">SMART</button>

  <div class="hud hud-title">
    <h1 id="robotName">NOVA</h1>
    <p>Your futuristic AI companion</p>
  </div>

  <!-- Model load progress -->
  <div class="load-panel" id="loadPanel">
    <div class="ring" id="loadRing">
      <div class="ring-inner">
        <span id="loadPct">0%</span>
      </div>
    </div>
    <div class="load-text">
      <div id="loadMsg">Downloading Neural Core...</div>
      <div class="load-bar"><span id="loadBarFill"></span></div>
      <div class="load-file" id="loadFile"></div>
    </div>
  </div>

  <!-- Chat -->
  <div class="chat-panel" id="chatPanel">
    <div class="chat-head">
      <span>NEURAL LINK · SESSION LOG</span>
      <button id="chatClose">✕</button>
    </div>
    <div class="chat-log" id="chatLog"></div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <input type="text" id="textInput" placeholder="Type a message..." autocomplete="off">
    <button class="send-btn" id="sendBtn">▸</button>
    <button class="mic-btn" id="micBtn">
      <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="9" y="2" width="6" height="12" rx="3"/>
        <path d="M5 10v2a7 7 0 0 0 14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
      </svg>
    </button>
  </div>

  <script type="module" src="main.js?v=4"></script>
</body>
</html>
